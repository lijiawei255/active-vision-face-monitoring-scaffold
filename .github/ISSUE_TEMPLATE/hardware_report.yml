name: Raspberry Pi hardware report
description: Report actual Picamera2/PCA9685/servo results (HIL).
title: "[hardware] "
labels: [hardware]
body:
  - type: markdown
    attributes:
      value: |
        Use this template only after running `scripts/rpi_smoke.py` and/or
        `scripts/rpi_bench.py`. Do not attach face photos or personal data.
  - type: input
    id: pi
    attributes:
      label: Pi model / OS / power supply
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera model / mounting / flip
    validations:
      required: true
  - type: input
    id: servo
    attributes:
      label: Servo driver / servos / channels / limits
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      description: Include profile, servo mode, duration.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Attach `var/hil_report.json` and benchmark JSON.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: External 5V supply and common ground used
        - label: Mechanical limits verified
        - label: Emergency stop available
