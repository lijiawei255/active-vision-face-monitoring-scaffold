name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev tools
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Docs parity
        run: python scripts/check_docs_parity.py
      - name: Docs links
        run: python scripts/check_docs_links.py

  test-core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Linux GUI/audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Download YuNet model
        run: avfm models download --only yunet
      - name: Core tests with coverage
        run: python -m pytest -m "not webcam and not hardware and not mediapipe" --cov=avfm --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  test-mediapipe:
    name: mediapipe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Linux GUI/audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2
      - name: Install with MediaPipe
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,mediapipe]"
      - name: Download models
        run: avfm models download --all
      - name: Model tests
        run: python -m pytest -m "mediapipe or model" --no-cov

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and check
        run: |
          python -m pip install -U pip
          python -m pip install build twine
          python -m build
          twine check dist/*
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/avfm-wheel
          /tmp/avfm-wheel/bin/python -m pip install -U pip
          /tmp/avfm-wheel/bin/python -m pip install dist/*.whl
          /tmp/avfm-wheel/bin/avfm selftest
          /tmp/avfm-wheel/bin/avfm --version
          /tmp/avfm-wheel/bin/avfm doctor --json
