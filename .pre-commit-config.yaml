default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy
        name: mypy (src)
        entry: python -m mypy
        language: system
        pass_filenames: false
      - id: docs-parity
        name: bilingual docs parity
        entry: python scripts/check_docs_parity.py
        language: system
        pass_filenames: false
      - id: docs-links
        name: relative markdown links
        entry: python scripts/check_docs_links.py
        language: system
        pass_filenames: false
