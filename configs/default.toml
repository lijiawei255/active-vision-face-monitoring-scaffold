# Default configuration. Mirrors the dataclass defaults in src/avfm/config.py.
# Profiles in this directory contain only overrides and are deep-merged on top.

[runtime]
fps = 15.0
show = false
log_level = "INFO"
max_frame_age_s = 0.5
report_metrics = true

[camera]
source = "webcam:0"
width = 640
height = 480
fps = 15.0
flip = "none"
hfov_deg = 60.0
warmup_s = 0.5

[detector]
mode = "single"
backend = "auto"
tracking_backend = "yunet"
fatigue_backend = "mediapipe"
interval_frames = 1
tracking_interval_frames = 1
fatigue_interval_frames = 2
yunet_model = "models/yunet/face_detection_yunet_2026may.onnx"
mediapipe_model = "models/mediapipe/face_landmarker.task"
max_faces = 1
score_threshold = 0.6
nms_threshold = 0.3
min_detection_confidence = 0.5
min_presence_confidence = 0.5
min_tracking_confidence = 0.5

[tracker]
deadband_x = 0.03
deadband_y = 0.03
hold_last_s = 0.3
lost_timeout_s = 10.0
ema_alpha = 0.5
default_pan = 90.0
default_tilt = 80.0
scan_step_deg = 5.0
scan_interval_s = 0.2
scan_tilt_deg = 80.0
scan_max_cycles = 0
invert_pan = false
invert_tilt = false

[tracker.pan_pid]
kp = 120.0
ki = 5.0
kd = 1.2
output_limit = 240.0
integral_limit = 50.0
deadband = 0.03
integral_decay = 1.0

[tracker.tilt_pid]
kp = 100.0
ki = 5.0
kd = 1.0
output_limit = 200.0
integral_limit = 50.0
deadband = 0.03
integral_decay = 1.0

[gimbal]
pan_min = 40.0
pan_max = 180.0
tilt_min = 0.0
tilt_max = 140.0
max_step_deg = 10.0
command_deadband_deg = 0.2
park_on_exit = true

[fatigue]
enabled = true
ear_threshold = 0.2
ear_calibration_file = ""
closure_confirm_s = 0.3
microsleep_s = 1.5
blink_min_s = 0.05
blink_max_s = 0.4
perclos_window_s = 60.0
perclos_threshold = 0.2
perclos_min_coverage = 0.8
perclos_warmup_s = 30.0
perclos_max_gap_s = 0.5
max_metrics_age_s = 0.5
distraction_yaw_deg = 20.0
distraction_pitch_deg = 15.0
distraction_confirm_s = 2.0
recovery_s = 2.0
event_cooldown_s = 15.0
face_lost_s = 1.0
ear_max_yaw_deg = 25.0
ear_max_pitch_deg = 20.0
max_reproj_error_px = 20.0

[actuator]
backend = "none"
assume_camera_moves = false
on_error = "passive"
pca9685_address = 0x40
pca9685_frequency = 50
pan_channel = 2
tilt_channel = 3
min_pulse_us = 500
max_pulse_us = 2500
