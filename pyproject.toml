[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "avfm"
version = "0.1.2"
description = "Active Vision Face Monitoring: a hardware-agnostic, testable scaffold for 2-DOF PID gimbal face tracking and fatigue monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jiawei Li" }]
keywords = [
  "active-vision",
  "face-tracking",
  "fatigue-detection",
  "drowsiness",
  "perclos",
  "pid",
  "pan-tilt",
  "raspberry-pi",
  "opencv",
  "mediapipe",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "numpy>=2.0,<3",
  # OpenCV 5 is required: OpenCV 5 moved Haar/HOG to contrib and the pip
  # wheels no longer ship cv2.data/haarcascades. We use cv2.FaceDetectorYN
  # (YuNet) instead, which lives in the core objdetect module.
  "opencv-contrib-python>=5.0,<6",
]

[project.optional-dependencies]
mediapipe = ["mediapipe>=1.1,<2"]
rpi = [
  "adafruit-circuitpython-servokit>=1.3,<2; sys_platform == 'linux'",
  "picamera2>=0.3.38; sys_platform == 'linux'",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "pytest-timeout>=2,<3",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
  "pre-commit>=3,<5",
  "build>=1,<2",
  "twine>=7,<8",
]

[project.scripts]
avfm = "avfm.cli:main"

[project.urls]
Homepage = "https://github.com/lijiawei255/active-vision-face-monitoring-scaffold"
Repository = "https://github.com/lijiawei255/active-vision-face-monitoring-scaffold"
Issues = "https://github.com/lijiawei255/active-vision-face-monitoring-scaffold/issues"
Changelog = "https://github.com/lijiawei255/active-vision-face-monitoring-scaffold/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/avfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=60"
markers = [
  "model: requires a downloaded YuNet model",
  "mediapipe: requires mediapipe and the face_landmarker model",
  "webcam: requires a working local camera",
  "hardware: requires real Raspberry Pi camera/servo hardware",
  "slow: long-running test",
]
filterwarnings = [
  "ignore::DeprecationWarning:mediapipe.*",
  "ignore::UserWarning:matplotlib.*",
]

[tool.coverage.run]
source = ["avfm"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src"]
# The package ships a `py.typed` marker, so the public API is checked and
# kept honest by CI. Tests are intentionally not type-checked: they use
# pytest fixtures whose types are hard to express without extra plugins.
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_equality = true
# OpenCV, MediaPipe, Picamera2 and Adafruit ServoKit ship no type stubs; they
# are treated as `Any` at the import boundary only.
ignore_missing_imports = true
